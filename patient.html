<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Detail — Patient Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec; --surface: #ffffff; --primary: #1a3a2a; --accent: #4a7c59;
      --accent2: #c8a96e; --text: #1c1c1c; --muted: #7a7a7a; --border: #e0dbd2;
      --danger: #c0392b; --warning: #e67e22; --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

    .topbar {
      background: var(--primary); color: white; display: flex; align-items: center;
      justify-content: space-between; padding: 0 32px; height: 56px; position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { font-family: 'DM Serif Display', serif; font-size: 1.2rem; }
    .topbar-nav { display: flex; gap: 4px; }
    .topbar-nav a { color: rgba(255,255,255,0.75); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
    .topbar-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .user-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px 4px 8px; font-size: 0.82rem; }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #6ee7a0; }
    .user-select { background: transparent; border: none; color: white; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; cursor: pointer; outline: none; }
    .user-select option { color: #1c1c1c; background: white; }

    .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .patient-header { margin-bottom: 28px; }
    .patient-name { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--primary); }
    .patient-meta { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: var(--surface); border-radius: 12px; padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--primary); margin-bottom: 14px; }

    .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
    label { font-size: 0.76rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea {
      padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--text);
      background: var(--bg); transition: border-color 0.15s; outline: none; width: 100%;
    }
    input:focus, select:focus { border-color: var(--accent); background: white; }

    .btn {
      padding: 9px 18px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--accent); }
    .btn-green { background: var(--accent); color: white; }
    .btn-green:hover { background: #3d6b4a; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.85; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-sm { padding: 5px 11px; font-size: 0.78rem; }

    /* Inference box */
    .inference-box {
      background: #fffbef; border: 1.5px solid var(--accent2); border-radius: 10px;
      padding: 16px; margin-top: 10px; display: none;
    }
    .inference-item { margin-bottom: 10px; }
    .inference-item:last-child { margin-bottom: 0; }
    .inference-name { font-weight: 600; color: var(--primary); }
    .inference-meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .evidence-pill {
      display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 8px;
      border-radius: 10px; font-size: 0.75rem; font-weight: 500; margin: 2px;
    }

    /* Observations table */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    thead th { background: var(--primary); color: white; padding: 11px 14px; text-align: left; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f9f7f3; }
    tbody tr.inferred-row td { font-style: italic; color: #666; background: #fafafa; }
    tbody tr.inferred-row:hover td { background: #f5f3ef; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-rejected { background: #fce4ec; color: #c62828; }
    .badge-meas { background: #e3f2fd; color: #1565c0; }
    .badge-cat { background: #fff3e0; color: #e65100; }
    .badge-anomaly { background: #fff3e0; color: #bf360c; border: 1px solid #ff8f00; }
    .badge-inferred { background: #ede7f6; color: #4527a0; font-style: italic; }

    .empty-row td { text-align: center; color: var(--muted); padding: 32px; font-style: italic; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">🏥 Patient Tracker</div>
  <nav class="topbar-nav">
    <a href="index.html">Patients</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logs.html">Logs</a>
  </nav>
  <div class="topbar-right">
    <div class="user-pill">
      <div class="user-dot"></div>
      <select class="user-select" id="user-select" onchange="setUser(this.value)">
        <option value="staff">staff</option>
      </select>
    </div>
  </div>
</div>

<div class="page">
  <a class="back-link" href="index.html">← All Patients</a>

  <div class="patient-header">
    <div class="patient-name" id="patient-name">Loading...</div>
    <div class="patient-meta" id="patient-info"></div>
  </div>

  <div class="grid-2">
    <!-- Record Measurement -->
    <div class="card">
      <div class="card-title">📏 Record Measurement</div>
      <div class="fg">
        <label>Phenomenon Type (Quantitative)</label>
        <select id="meas-type" onchange="loadUnitsForType()"></select>
      </div>
      <div class="fg">
        <label>Amount</label>
        <input id="meas-amount" type="number" step="0.01" placeholder="e.g. 98.6">
      </div>
      <div class="fg">
        <label>Unit</label>
        <select id="meas-unit"><option value="">-- Select Unit --</option></select>
      </div>
      <div class="fg">
        <label>Applicability Time (optional)</label>
        <input id="meas-time" type="datetime-local">
      </div>
      <div class="fg">
        <label>Protocol (optional)</label>
        <select id="meas-protocol"><option value="">None</option></select>
      </div>
      <button class="btn btn-primary" onclick="recordMeasurement()">Record Measurement</button>
    </div>

    <!-- Record Category Observation -->
    <div class="card">
      <div class="card-title">🏷️ Record Category Observation</div>
      <div class="fg">
        <label>Phenomenon Type (Qualitative)</label>
        <select id="cat-type" onchange="loadPhenomenaForType()"></select>
      </div>
      <div class="fg">
        <label>Phenomenon</label>
        <select id="cat-phenomenon"></select>
      </div>
      <div class="fg">
        <label>Presence</label>
        <select id="cat-presence">
          <option value="PRESENT">PRESENT</option>
          <option value="ABSENT">ABSENT</option>
        </select>
      </div>
      <div class="fg">
        <label>Applicability Time (optional)</label>
        <input id="cat-time" type="datetime-local">
      </div>
      <div class="fg">
        <label>Protocol (optional)</label>
        <select id="cat-protocol"><option value="">None</option></select>
      </div>
      <button class="btn btn-green" onclick="recordCategory()">Record Observation</button>
    </div>
  </div>

  <!-- Evaluate -->
  <div class="card" style="margin-bottom:20px">
    <button class="btn btn-green" onclick="evaluateRules()">🔍 Evaluate Diagnostic Rules</button>
    <div class="inference-box" id="inference-box"></div>
  </div>

  <!-- Observations -->
  <div class="card">
    <div class="card-title" style="justify-content:space-between">
      <span>
        📋 Observations
        <span style="font-size:0.78rem;font-weight:400;color:var(--muted);margin-left:8px">
          <em>italics</em> = inferred &nbsp;|&nbsp; 🚨 = anomaly
        </span>
      </span>
      <label style="font-size:0.8rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="hide-rejected" onchange="loadObservations()" style="width:auto;padding:0">
        Hide rejected
      </label>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Type</th><th>Phenomenon / Type</th>
            <th>Value</th><th>Unit / Presence</th><th>Anomaly</th><th>Source</th>
            <th>Protocol</th><th>Recorded</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="obs-table">
          <tr class="empty-row"><td colspan="11">Loading observations...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = 'https://patient-observation-tracker-backend-hg23.onrender.com';
  const params = new URLSearchParams(location.search);
  const patientId = params.get('id');

  function getCurrentUser() { return sessionStorage.getItem('currentUser') || 'staff'; }
  function setUser(u) { if (u) sessionStorage.setItem('currentUser', u); }

  async function loadUsers() {
    try {
      const users = await fetch(`${API}/api/users`).then(r => r.json());
      const sel = document.getElementById('user-select');
      const current = getCurrentUser();
      if (users.length > 0) {
        sel.innerHTML = users.map(u =>
          `<option value="${u.username}" ${u.username === current ? 'selected' : ''}>${u.username} (${u.role})</option>`
        ).join('');
      }
    } catch(e) {}
  }

  async function init() {
    const p = await fetch(`${API}/api/patients/${patientId}`).then(r => r.json());
    document.getElementById('patient-name').textContent = p.fullName;
    document.getElementById('patient-info').textContent =
      `DOB: ${p.dateOfBirth || 'N/A'}  ·  Note: ${p.note || 'None'}`;

    const allTypes = await fetch(`${API}/api/phenomenon-types`).then(r => r.json());
    const quantTypes = allTypes.filter(t => t.kind === 'QUANTITATIVE');
    const qualTypes = allTypes.filter(t => t.kind === 'QUALITATIVE');

    document.getElementById('meas-type').innerHTML =
      quantTypes.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    loadUnitsForType();

    document.getElementById('cat-type').innerHTML =
      qualTypes.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

    const protocols = await fetch(`${API}/api/protocols`).then(r => r.json());
    const opts = '<option value="">None</option>' +
      protocols.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('meas-protocol').innerHTML = opts;
    document.getElementById('cat-protocol').innerHTML = opts;

    loadPhenomenaForType();
    loadObservations();
  }

  async function loadPhenomenaForType() {
    const typeId = document.getElementById('cat-type').value;
    if (!typeId) return;
    try {
      const res = await fetch(`${API}/api/phenomenon-types/${typeId}/phenomena`);
      if (!res.ok) throw new Error(res.status);
      const phenomena = await res.json();
      document.getElementById('cat-phenomenon').innerHTML = phenomena.length
        ? phenomena.map(ph => `<option value="${ph.id}">${ph.name}</option>`).join('')
        : '<option value="">No phenomena for this type</option>';
    } catch(e) {
      document.getElementById('cat-phenomenon').innerHTML =
        '<option value="">Error loading phenomena</option>';
    }
  }

  async function loadUnitsForType() {
    const typeId = document.getElementById('meas-type').value;
    const unitSelect = document.getElementById('meas-unit');
    unitSelect.innerHTML = '<option value="">-- Select Unit --</option>';
    if (!typeId) return;
    const type = await fetch(`${API}/api/phenomenon-types/${typeId}`).then(r => r.json());
    (type.allowedUnits || []).forEach(u => {
      const opt = document.createElement('option');
      opt.value = u; opt.textContent = u;
      unitSelect.appendChild(opt);
    });
  }

  async function loadObservations() {
    let obs;
    try {
      obs = await fetch(`${API}/api/patients/${patientId}/observations`).then(r => r.json());
    } catch(e) {
      document.getElementById('obs-table').innerHTML =
        '<tr class="empty-row"><td colspan="11">Failed to load observations.</td></tr>';
      return;
    }

    // Always hide UNDONE observations (undo = "never happened")
    obs = obs.filter(o => o.rejectionReason !== 'Undone by user');

    // "Hide rejected" checkbox additionally hides user-rejected ones
    const hideRejected = document.getElementById('hide-rejected')?.checked;
    if (hideRejected) obs = obs.filter(o => o.status !== 'REJECTED');

    const tbody = document.getElementById('obs-table');
    if (obs.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="11">No observations recorded yet.</td></tr>';
      return;
    }

    tbody.innerHTML = obs.map(o => {
      // Prefer the Jackson "type" discriminator; fall back to checking which data fields
      // are actually present (phenomenonType = measurement, phenomenon = category)
      const isMeas = o.type === 'MEASUREMENT'
                  || (o.phenomenonType != null && o.phenomenon == null);
      const isInferred = o.source === 'INFERRED';

      // Phenomenon/Type column:
      //   Measurement → phenomenonType.name  (e.g. "Body Temperature")
      //   Category    → phenomenon.phenomenonType.name  (e.g. "Blood Group")
      const phenLabel = isMeas
        ? (o.phenomenonType?.name || '<em style="color:var(--muted)">(unknown type)</em>')
        : (o.phenomenon?.phenomenonType?.name || o.phenomenon?.name || '<em style="color:var(--muted)">(unknown)</em>');

      // Value column:
      //   Measurement → numeric amount  (e.g. 36.8)
      //   Category    → phenomenon name (e.g. "A+")
      const value = isMeas
        ? (o.amount != null ? o.amount : '—')
        : (o.phenomenon?.name || '—');

      // Unit/Presence column:
      //   Measurement → unit string  (e.g. "Celsius")
      //   Category    → PRESENT / ABSENT
      const unitOrPres = isMeas ? (o.unit || '—') : (o.presence || '—');

      // Separate anomaly column
      const anomaly = o.anomalyFlag
        ? `<span class="badge badge-anomaly" title="Outside normal range">🚨</span>` : '—';

      const proto = o.protocol?.name || '—';
      const recorded = o.recordingTime ? o.recordingTime.replace('T', ' ').substring(0, 16) : '—';

      const typeBadge = isMeas
        ? `<span class="badge badge-meas">Measurement</span>`
        : `<span class="badge badge-cat">Category</span>`;

      const sourceBadge = isInferred
        ? `<span class="badge badge-inferred">INFERRED</span>`
        : `<span class="badge" style="background:#f1f8e9;color:#558b2f">MANUAL</span>`;

      // Detect UndoService-set reason so we can show UNDONE instead of REJECTED
      const isUndone = o.status === 'REJECTED' && o.rejectionReason === 'Undone by user';
      const statusBadge = o.status === 'ACTIVE'
        ? `<span class="badge badge-active">ACTIVE</span>`
        : isUndone
          ? `<span class="badge" style="background:#ede7f6;color:#4527a0" title="Undone from command log">UNDONE</span>`
          : `<span class="badge badge-rejected">REJECTED</span>`;

      const rejectBtn = o.status === 'ACTIVE' && !isInferred
        ? `<button class="btn btn-danger btn-sm" onclick="rejectObs(${o.id})">Reject</button>` : '—';

      const rowClass = isInferred ? 'inferred-row' : '';

      return `<tr class="${rowClass}">
        <td>${o.id}</td>
        <td>${typeBadge}</td>
        <td>${phenLabel}</td>
        <td>${value}</td>
        <td>${unitOrPres}</td>
        <td>${anomaly}</td>
        <td>${sourceBadge}</td>
        <td>${proto}</td>
        <td>${recorded}</td>
        <td>${statusBadge}</td>
        <td>${rejectBtn}</td>
      </tr>`;
    }).join('');
  }

  async function recordMeasurement() {
    const amountVal = document.getElementById('meas-amount').value;
    const unitVal = document.getElementById('meas-unit').value;
    const typeVal = document.getElementById('meas-type').value;
    if (!typeVal) { alert('No quantitative phenomenon types available.'); return; }
    if (amountVal === '') { alert('Amount is required.'); return; }
    if (!unitVal) { alert('Unit is required.'); return; }
    const body = {
      patientId: parseInt(patientId),
      phenomenonTypeId: parseInt(typeVal),
      amount: parseFloat(amountVal),
      unit: unitVal,
      applicabilityTime: document.getElementById('meas-time').value || null,
      protocolId: document.getElementById('meas-protocol').value || null
    };
    const res = await fetch(`${API}/api/observations/measurement`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Username': getCurrentUser() },
      body: JSON.stringify(body)
    });
    if (!res.ok) { alert(await res.text()); return; }
    document.getElementById('meas-amount').value = '';
    document.getElementById('meas-time').value = '';
    loadObservations();
  }

  async function recordCategory() {
    const phenVal = document.getElementById('cat-phenomenon').value;
    if (!phenVal) { alert('No phenomena available for this type.'); return; }
    const body = {
      patientId: parseInt(patientId),
      phenomenonId: parseInt(phenVal),
      presence: document.getElementById('cat-presence').value,
      applicabilityTime: document.getElementById('cat-time').value || null,
      protocolId: document.getElementById('cat-protocol').value || null
    };
    const res = await fetch(`${API}/api/observations/category`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Username': getCurrentUser() },
      body: JSON.stringify(body)
    });
    if (!res.ok) { alert(await res.text()); return; }
    document.getElementById('cat-time').value = '';
    loadObservations();
  }

  async function rejectObs(obsId) {
    const reason = prompt('Rejection reason:');
    if (!reason) return;
    await fetch(`${API}/api/observations/${obsId}/reject`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Username': getCurrentUser() },
      body: JSON.stringify({ reason })
    });
    loadObservations();
  }

  async function evaluateRules() {
    const res = await fetch(`${API}/api/patients/${patientId}/evaluate`, {
      method: 'POST',
      headers: { 'X-Username': getCurrentUser() }
    });
    const inferences = await res.json();
    const box = document.getElementById('inference-box');
    box.style.display = 'block';

    if (!inferences || inferences.length === 0) {
      box.innerHTML = '✅ <strong>No rules fired</strong> for current active manual observations.';
      return;
    }

    // Handle both old format (array of PhenomenonType) and new enriched format
    box.innerHTML = '<div style="font-weight:600;margin-bottom:10px">🔔 Inferred Concepts:</div>' +
      inferences.map(inf => {
        // New enriched format has: name, strategyUsed, evidenceObservations
        if (inf.name && inf.strategyUsed) {
          const evidencePills = (inf.evidenceObservations || []).map(e =>
            `<span class="evidence-pill">${e}</span>`
          ).join('');
          return `<div class="inference-item">
            <div class="inference-name">→ ${inf.name}</div>
            <div class="inference-meta">
              Strategy: <strong>${inf.strategyUsed}</strong>
              ${inf.evidenceObservations?.length ? ' · Evidence: ' + evidencePills : ''}
            </div>
          </div>`;
        }
        // Fallback: simple name string or PhenomenonType object
        const name = typeof inf === 'string' ? inf : (inf.name || JSON.stringify(inf));
        return `<div class="inference-item"><div class="inference-name">→ ${name}</div></div>`;
      }).join('');
  }

  // Auto-reload observations when user switches back to this tab (e.g. after undoing in logs page)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadObservations();
  });

  loadUsers();
  init();
</script>
</body>
</html>
