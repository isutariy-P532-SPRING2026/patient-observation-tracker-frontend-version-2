<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Observation Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec;
      --surface: #ffffff;
      --primary: #1a3a2a;
      --accent: #4a7c59;
      --accent2: #c8a96e;
      --text: #1c1c1c;
      --muted: #7a7a7a;
      --border: #e0dbd2;
      --danger: #c0392b;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Top bar */
    .topbar {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 56px;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { font-family: 'DM Serif Display', serif; font-size: 1.2rem; letter-spacing: 0.02em; }
    .topbar-nav { display: flex; gap: 4px; }
    .topbar-nav a {
      color: rgba(255,255,255,0.75); text-decoration: none; padding: 6px 14px;
      border-radius: 6px; font-size: 0.85rem; font-weight: 500; transition: all 0.15s;
    }
    .topbar-nav a:hover, .topbar-nav a.active { background: rgba(255,255,255,0.15); color: white; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px 4px 8px;
      font-size: 0.82rem;
    }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #6ee7a0; }
    .user-select {
      background: transparent; border: none; color: white; font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; cursor: pointer; outline: none;
    }
    .user-select option { color: #1c1c1c; background: white; }

    /* Layout */
    .page { max-width: 960px; margin: 0 auto; padding: 36px 24px; }
    .page-title { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--primary); margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

    /* Card */
    .card {
      background: var(--surface); border-radius: 12px; padding: 28px;
      box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px;
    }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input, textarea, select {
      padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--text);
      background: var(--bg); transition: border-color 0.15s; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); background: white; }

    /* Button */
    .btn {
      padding: 10px 22px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--accent); }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    thead th { background: var(--primary); color: white; padding: 12px 16px; text-align: left; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f9f7f3; }
    .link { color: var(--accent); text-decoration: none; font-weight: 500; }
    .link:hover { text-decoration: underline; }

    .empty-row td { text-align: center; color: var(--muted); padding: 32px; font-style: italic; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">🏥 Patient Tracker</div>
  <nav class="topbar-nav">
    <a href="index.html" class="active">Patients</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logs.html">Logs</a>
  </nav>
  <div class="topbar-right">
    <div class="user-pill">
      <div class="user-dot"></div>
      <select class="user-select" id="user-select" onchange="setUser(this.value)">
        <option value="">Loading...</option>
      </select>
    </div>
  </div>
</div>

<div class="page">
  <div class="page-title">Patients</div>
  <div class="page-sub">Manage patient records and observations</div>

  <div class="card">
    <div class="card-title">➕ Add New Patient</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input id="dob" type="date">
      </div>
      <div class="form-group full">
        <label>Clinical Note</label>
        <textarea id="note" rows="2" placeholder="Optional note..."></textarea>
      </div>
    </div>
    <br>
    <button class="btn btn-primary" onclick="createPatient()">Add Patient</button>
  </div>

  <div class="card">
    <div class="card-title">👥 All Patients</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Date of Birth</th><th>Note</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="patient-list">
          <tr class="empty-row"><td colspan="5">Loading patients...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = 'https://patient-observation-tracker-backend-hg23.onrender.com';

  // ---- User management ----
  function getCurrentUser() {
    return sessionStorage.getItem('currentUser') || 'staff';
  }
  function setUser(username) {
    if (!username) return;
    sessionStorage.setItem('currentUser', username);
  }

  async function loadUsers() {
    try {
      const users = await fetch(`${API}/api/users`).then(r => r.json());
      const sel = document.getElementById('user-select');
      const current = getCurrentUser();
      if (users.length === 0) {
        sel.innerHTML = `<option value="staff">staff</option>`;
      } else {
        sel.innerHTML = users.map(u =>
          `<option value="${u.username}" ${u.username === current ? 'selected' : ''}>${u.username} (${u.role})</option>`
        ).join('');
      }
    } catch(e) {
      document.getElementById('user-select').innerHTML = `<option value="staff">staff</option>`;
    }
  }

  // ---- Patients ----
  async function loadPatients() {
    const patients = await fetch(`${API}/api/patients`).then(r => r.json());
    const tbody = document.getElementById('patient-list');
    if (patients.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No patients yet.</td></tr>';
      return;
    }
    tbody.innerHTML = patients.map(p => `
      <tr>
        <td>${p.id}</td>
        <td><strong>${p.fullName}</strong></td>
        <td>${p.dateOfBirth || '—'}</td>
        <td>${p.note || '—'}</td>
        <td><a class="link" href="patient.html?id=${p.id}">View →</a></td>
      </tr>`).join('');
  }

  async function createPatient() {
    const body = {
      fullName: document.getElementById('name').value.trim(),
      dateOfBirth: document.getElementById('dob').value || null,
      note: document.getElementById('note').value
    };
    if (!body.fullName) { alert('Full name is required.'); return; }
    await fetch(`${API}/api/patients`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Username': getCurrentUser() },
      body: JSON.stringify(body)
    });
    document.getElementById('name').value = '';
    document.getElementById('dob').value = '';
    document.getElementById('note').value = '';
    loadPatients();
  }

  loadUsers();
  loadPatients();
</script>
</body>
</html>
